name: Approval policy verification
on:
  push:
    branches: ['feature/approval-workflow-20261127']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - run: node tests/approval-workflow-policy.mjs
      - run: node tests/approval-workflow-sql.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
